# Robô do GitHub que avisa (abrindo um Pull Request) quando alguma biblioteca
# do app tem atualização, principalmente as de segurança.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
